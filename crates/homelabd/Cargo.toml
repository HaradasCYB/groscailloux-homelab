[package]
name = "homelabd"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
homelab-core.workspace = true
tokio.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rand.workspace = true
sha2.workspace = true
axum = { version = "0.8", features = ["json", "http1", "tokio"] }
notify = "8"

[dev-dependencies]
# `oneshot` : tests de la couche d'administration (déjà dans l'arbre, via axum)
tower = { version = "0.5", features = ["util"] }
# horloge en pause (`start_paused`) : relecture de l'adresse de NPM sans attendre ses délais
tokio = { workspace = true, features = ["test-util"] }
