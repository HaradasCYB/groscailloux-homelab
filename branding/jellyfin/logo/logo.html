<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,800;112,900&display=swap">
<style>
  html,body{margin:0;background:transparent}
  .row{display:flex;align-items:center;gap:0;padding:0}
  #banner{display:inline-flex;align-items:center;gap:34px;padding:18px 26px 18px 18px}
  #banner svg{width:190px;height:190px;flex:none}
  .word{font-family:"Archivo",sans-serif;font-stretch:112%;font-weight:900;font-size:150px;letter-spacing:-4px;color:#f4f6fa;line-height:1}
  .tv{font-family:"Archivo",sans-serif;font-stretch:112%;font-weight:800;font-size:96px;color:#fff;background:linear-gradient(135deg,#5aa6ff,#1f6fe0);border-radius:22px;padding:6px 22px 10px;margin-left:24px;line-height:1;letter-spacing:-1px}
  #icon{width:512px;height:512px;display:grid;place-items:center}
  #icon svg{width:480px;height:480px}
  #touch{width:180px;height:180px;display:grid;place-items:center;background:#0b0d12;border-radius:0}
  #touch svg{width:150px;height:150px}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6cb2ff"/><stop offset=".55" stop-color="#2f8fff"/><stop offset="1" stop-color="#1552b8"/></linearGradient>
  <symbol id="galet" viewBox="0 0 64 64">
    <path d="M32 5c15 0 28 7.5 28 23.5C60 46 47.5 59 31 59 14.5 59 4 47.5 4 32.5 4 16 16.5 5 32 5z" fill="url(#g)"/>
    <path d="M14 16c5-5 12-7 18-7" stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M26 21.5v21l17-10.5z" fill="#fff"/>
  </symbol></defs></svg>
<div id="banner"><svg><use href="#galet"/></svg><span class="word">Groscailloux</span><span class="tv">TV</span></div>
<div id="icon"><svg><use href="#galet"/></svg></div>
<div id="touch"><svg><use href="#galet"/></svg></div>
</body></html>
