# Remote de la seedbox, monté sur /mnt/seedbox par homelab-seedbox-mount.service.
# Clé dédiée (commentaire `homelab-sftp-rd`) restreinte côté seedbox, sans shell, à
# `sftp-server -P write,mkdir,rename,posix-rename,symlink,hardlink,setstat,fsetstat,lsetstat,copy-data` :
# lecture et suppression (bouton « Supprimer » de Jellyfin), aucune écriture de contenu (depuis le 2026-09-15 ;
# avant : `-R`, lecture seule). Pas de shell_type ni de commandes de hash, et aucun secret ici.
# MODÈLE, jamais lu tel quel par rclone. Hôte SFTP et compte : hors du dépôt public (SEEDBOX_SFTP_HOST, SEEDBOX_USER
# dans .env). À chaque démarrage, l'unité écrit la config effective /run/homelab-seedbox-mount/rclone.conf (600) :
# ce modèle avec host et user remplacés (scripts/seedbox-rclone-conf.sh). Ils vont DANS le fichier, jamais en options
# --sftp-host/--sftp-user : une option de backend change le nom interne du remote, donc le dossier du cache VFS
# (seedbox{9oylk}, 120 Go). Pour la même raison, un réglage SFTP nouveau s'ajoute ici, pas en option de l'unité.
# host = seedbox.invalid : nom réservé qui ne se résout jamais (sans hôte, rclone joindrait le sshd du VPS).
# À la main, montage en marche : `rclone --config /run/homelab-seedbox-mount/rclone.conf lsd seedbox:` (en deploy).
[seedbox]
type = sftp
host = seedbox.invalid
user = seedbox
port = 22
key_file = /home/deploy/.ssh/seedbox_sftp_ro
known_hosts_file = /home/deploy/.ssh/known_hosts
shell_type = none
md5sum_command = none
sha1sum_command = none
set_modtime = false
concurrency = 16
# blocs SFTP de 255 Ko : 5 → 16 Mo/s par flux sur 96 ms de latence (mesuré le 2026-09-12)
chunk_size = 255k
