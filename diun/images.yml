# Images surveillées par diun (provider file). Pour les tags immuables, watch_repo
# notifie l'apparition de nouveaux tags correspondant à include_tags.
# Mise à jour = changer tag+digest dans docker-compose.yml, pull, up -d.
# sort_tags: semver est indispensable aux tags semver (3 composantes) : le tri par défaut est
# alphabétique inversé, donc « 9.5.9 » passe devant « 13.2.3 » et max_tags: 3 ne voit jamais le
# dernier. Il ne convient PAS aux tags linuxserver (4 composantes + -lsN, hachés pour duckdns) :
# le tri semver y prend les plus anciens. Ceux-là gardent le tri par défaut.

# --- linuxserver.io : tags <version>-ls<N>
- name: lscr.io/linuxserver/sonarr:4.0.17.2952-ls309
  watch_repo: true
  max_tags: 3
  include_tags: ['^\d+\.\d+\.\d+\.\d+-ls\d+$']
- name: lscr.io/linuxserver/radarr:6.1.1.10360-ls300
  watch_repo: true
  max_tags: 3
  include_tags: ['^\d+\.\d+\.\d+\.\d+-ls\d+$']
- name: lscr.io/linuxserver/prowlarr:2.6.5.5623-ls163
  watch_repo: true
  max_tags: 3
  include_tags: ['^\d+\.\d+\.\d+\.\d+-ls\d+$']
- name: lscr.io/linuxserver/qbittorrent:5.1.4-r3-ls452
  watch_repo: true
  max_tags: 3
  include_tags: ['^\d+\.\d+\.\d+_v[\d.]+-ls\d+$']
- name: lscr.io/linuxserver/pyload-ng:0.5.0b3.dev99-ls232
  watch_repo: true
  max_tags: 3
  include_tags: ['^\d+\.\d+\.\d+.*-ls\d+$']
- name: lscr.io/linuxserver/duckdns:36a2e3a3-ls78
  watch_repo: true
  max_tags: 3
  include_tags: ['^[0-9a-f]{8}-ls\d+$']

