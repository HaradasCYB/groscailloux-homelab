<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
</head>
<body style="margin:0;padding:0;background:#f3f4f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2330;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4f8;padding:32px 12px;">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:16px;border:1px solid #e3e5ee;">
<tr><td style="padding:36px 36px 8px;">
  <div style="font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#6b6f80;font-weight:600;">Groscailloux</div>
  <h1 style="margin:14px 0 10px;font-size:24px;line-height:1.25;font-weight:700;color:#1f2330;">{{heading}}</h1>
  <p style="margin:0 0 18px;font-size:16px;line-height:1.55;color:#3a3f52;">{{intro}}</p>
</td></tr>
<tr><td style="padding:8px 36px 8px;" align="left">
  <a href="{{link}}" style="display:inline-block;background:#6d4de6;color:#ffffff;text-decoration:none;font-weight:700;font-size:16px;padding:14px 26px;border-radius:12px;">{{button}}</a>
</td></tr>
<tr><td style="padding:8px 36px 0;">
  <p style="margin:0 0 6px;font-size:13px;line-height:1.5;color:#6b6f80;">{{validity}}</p>
  <p style="margin:0 0 22px;font-size:13px;line-height:1.5;color:#6b6f80;word-break:break-all;">Si le bouton ne s'ouvre pas, copie ce lien dans ton navigateur :<br><a href="{{link}}" style="color:#6d4de6;">{{link}}</a></p>
</td></tr>
<tr><td style="padding:0 36px 32px;">
  <p style="margin:0;font-size:15px;line-height:1.55;color:#3a3f52;">{{outro}}</p>
</td></tr>
<tr><td style="padding:18px 36px 26px;border-top:1px solid #e3e5ee;">
  <p style="margin:0;font-size:12px;line-height:1.5;color:#8a8ea0;">{{footer}}</p>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
