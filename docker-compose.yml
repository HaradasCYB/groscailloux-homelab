x-base: &base
  restart: unless-stopped
  networks:
    - homelab

services:
  jellyfin:
    <<: *base
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: 1000:1000
    ports:
      - "8096:8096"
    volumes:
      - /opt/homelab/jellyfin/config:/config
      - /opt/homelab/jellyfin/cache:/cache
      - /opt/homelab/library/media:/media:ro
    tmpfs:
      - /cache/transcodes:rw,size=2g,uid=1000,gid=1000,mode=1777
    environment:
      - TZ=${TZ}
      - JELLYFIN_PublishedServerUrl=http://${HOST_IP}:8096

  jellyseerr:
    <<: *base
    image: ghcr.io/seerr-team/seerr:latest
    container_name: jellyseerr
    ports:
      - "5055:5055"
    volumes:
      - /opt/homelab/jellyseerr/config:/app/config
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=debug

  radarr:
    <<: *base
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    ports:
      - "7878:7878"
    volumes:
      - /opt/homelab/radarr/config:/config
      - /opt/homelab/library:/data
      - /opt/homelab/radarr/config/custom-cont-init.d:/custom-cont-init.d:ro
    environment:
      - TZ=${TZ}
      - PUID=1000
      - PGID=1000

  sonarr:
    <<: *base
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    ports:
      - "8989:8989"
    volumes:
      - /opt/homelab/sonarr/config:/config
      - /opt/homelab/library:/data
      - /opt/homelab/sonarr/config/custom-cont-init.d:/custom-cont-init.d:ro
    environment:
      - TZ=${TZ}
      - PUID=1000
      - PGID=1000

  prowlarr:
    <<: *base
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    ports:
      - "9696:9696"
    volumes:
      - /opt/homelab/prowlarr/config:/config
    environment:
      - TZ=${TZ}
      - PUID=1000
      - PGID=1000

  gluetun:
    <<: *base
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_PORT_FORWARDING_UP_COMMAND=/gluetun/scripts/qbit-update-port.sh "{{PORTS}}"
      - TZ=${TZ}
      - HEALTH_VPN_DURATION_INITIAL=60s
    volumes:
      - /opt/homelab/gluetun:/gluetun
      - /opt/homelab/scripts:/gluetun/scripts:ro

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      - /opt/homelab/qbittorrent/config:/config
      - /opt/homelab/library/downloads:/downloads
    environment:
      - TZ=${TZ}
      - PUID=1000
      - PGID=1000
      - WEBUI_PORT=8080
    restart: unless-stopped

  filebrowser:
    <<: *base
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    user: 1000:1000
    volumes:
      - /opt/homelab/filebrowser/database:/database
      - /opt/homelab/filebrowser/config:/config
      - /opt/homelab/library/downloads:/srv/downloads
      - /opt/homelab/library/media:/srv/media
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}

  homarr:
    <<: *base
    image: ghcr.io/homarr-labs/homarr:v1.59.3
    container_name: homarr
    ports:
      - "7575:7575"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/homelab/homarr:/appdata
    environment:
      - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY}
      - TZ=${TZ}

  glances:
    <<: *base
    image: nicolargo/glances:latest
    container_name: glances
    pid: host
    privileged: true
    ports:
      - "61208:61208"
    environment:
      - GLANCES_OPT=-w --disable-plugin sensors,raid,wifi,smart,connections,processlist,processcount,ports,ip,amps,folders,alert,diskio,docker,containers,programlist,help,load,memswap,now,percpu,psutilversion
      - TZ=${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro

  influxdb:
    <<: *base
    image: influxdb:2
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - /opt/homelab/influxdb/data:/var/lib/influxdb2
      - /opt/homelab/influxdb/config:/etc/influxdb2
    environment:
      - TZ=${TZ}
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_INIT_USERNAME}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_INIT_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_INIT_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_INIT_BUCKET}

  grafana:
    <<: *base
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - /opt/homelab/grafana:/var/lib/grafana
    environment:
      - TZ=${TZ}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource

  portainer:
    <<: *base
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/homelab/portainer:/data

  pyload:
    <<: *base
    image: lscr.io/linuxserver/pyload-ng:latest
    container_name: pyload
    ports:
      - "8000:8000"
    volumes:
      - /opt/homelab/pyload/config:/config
      - /opt/homelab/library/downloads:/downloads
    environment:
      - TZ=${TZ}
      - PUID=1000
      - PGID=1000

  npm:
    <<: *base
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - /opt/homelab/npm/data:/data
      - /opt/homelab/npm/letsencrypt:/etc/letsencrypt

  duckdns:
    <<: *base
    image: lscr.io/linuxserver/duckdns:latest
    container_name: duckdns
    environment:
      - TZ=${TZ}
      - PUID=1000
      - PGID=1000
      - SUBDOMAINS=${DUCKDNS_SUBDOMAIN}
      - TOKEN=${DUCKDNS_TOKEN}
      - LOG_FILE=true

  telegraf:
    <<: *base
    image: telegraf:latest
    container_name: telegraf
    group_add:
      - 986
    volumes:
      - /opt/homelab/telegraf/etc/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/hostfs:ro
    environment:
      - HOST_MOUNT_PREFIX=/hostfs
      - HOST_PROC=/hostfs/proc
      - HOST_SYS=/hostfs/sys
      - HOST_ETC=/hostfs/etc

  guacamole:
    <<: *base
    image: guacamole/guacamole:latest
    container_name: guacamole
    environment:
      GUACD_HOSTNAME: guacd
      MYSQL_HOSTNAME: guacdb
      MYSQL_DATABASE: ${GUACAMOLE_DB_NAME}
      MYSQL_USER: ${GUACAMOLE_DB_USER}
      MYSQL_PASSWORD: ${MYSQL_USER_PASSWORD}
    ports:
      - "8081:8080"
    depends_on:
      - guacd
      - guacdb

  guacd:
    <<: *base
    image: guacamole/guacd:latest
    container_name: guacd

  guacdb:
    <<: *base
    image: mysql:8.0
    container_name: guacdb
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${GUACAMOLE_DB_NAME}
      MYSQL_USER: ${GUACAMOLE_DB_USER}
      MYSQL_PASSWORD: ${MYSQL_USER_PASSWORD}
    volumes:
      - /opt/homelab/guacamole/mysql:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  onboarder:
    <<: *base
    build: ./onboarder
    container_name: onboarder
    ports:
      - "8765:8765"
    volumes:
      - /opt/homelab/scripts:/scripts:ro
    env_file:
      - /opt/homelab/.env
    environment:
      - TZ=${TZ}
      - ONBOARD_SCRIPT=/scripts/homelab-onboard-user.sh
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYSEERR_URL=http://jellyseerr:5055
      - JELLYFIN_PUBLIC_URL=${JELLYFIN_PUBLIC_URL}
      - JELLYSEERR_PUBLIC_URL=${JELLYSEERR_PUBLIC_URL}

networks:
  homelab:
    driver: bridge
