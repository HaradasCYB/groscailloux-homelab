# Journal de la machine (revue Kaizen du 2026-10-07), installé par `homelabctl install` dans
# /etc/systemd/journald.conf.d/homelab.conf, puis `systemctl restart systemd-journald` (ne coupe aucun service).
#
# homelabd et rclone tournent sous l'utilisateur deploy : journald les range dans user-1000.journal, dont les
# fichiers d'archive couvrent une longue période et partent en premier quand le plafond est atteint. Avec 500 Mo,
# `journalctl -u homelabd` ne remontait qu'à 3,3 jours (le 07/10) : impossible de relire une rafale de ffmpeg, un
# canari ou un redémarrage de la semaine précédente. ~45 Mo par jour (ssh 50 %, homelabd 16 %) : 2 Go ≈ 45 jours.
[Journal]
# Plafond d'espace disque du journal persistant (le disque a plusieurs centaines de Go libres).
SystemMaxUse=2G
# Un fichier par jour : journald supprime des fichiers entiers, une archive plus courte laisse un historique plus fin.
MaxFileSec=1day
# Durée de garde au plus, quel que soit l'espace (alignée sur le plafond d'espace ci-dessus).
MaxRetentionSec=45day
