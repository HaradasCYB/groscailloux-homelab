# Configuration de homelabd / homelabctl (non secrète, versionnée).
# Les secrets (clés API, SMTP, token) viennent de /opt/homelab/.env.
# Toute clé inconnue est refusée au démarrage.

[paths]
base = "/opt/homelab"
downloads = "/opt/homelab/library/downloads"   # surveillé par auto_import
downloads_in_container = "/downloads"           # même dossier vu par les Arrs et qBittorrent
state_file = "/opt/homelab/state/homelabd.json"
backups = "/opt/homelab/backups"

[urls]
sonarr = "http://localhost:8989"
radarr = "http://localhost:7878"
prowlarr = "http://localhost:9696"
qbittorrent = "http://localhost:8080"
jellyfin = "http://localhost:8096"
jellyseerr = "http://localhost:5055"

[web]
# 8766 : l'UI tourne sur l'hôte (plus dans un conteneur). NPM doit proxifier
# onboarder.<domaine> vers la passerelle du réseau docker (172.18.0.1) port 8766.
listen = "0.0.0.0:8766"
rate_limit_secs = 30
# X-Forwarded-For (adresse du membre ou de l'admin) n'est cru que d'un pair TCP de ces réseaux, jamais d'une
# adresse de l'hôte (127.0.0.1, 172.18.0.1) ; et seulement du conteneur NPM quand trusted_proxy_container est
# rempli (son IP change à chaque recréation : relue par docker inspect en tâche de fond). L'IP de la maison
# n'ouvre une session que vue par ce NPM confirmé par Docker. Docker muet (ou conteneur vide) : réseau entier,
# pour les limites par adresse seulement, sans session de la maison. Pair non cru : l'adresse retenue est
# celle du pair TCP.
trusted_proxies = ["172.18.0.0/16"]
trusted_proxy_container = "npm"

[onboard]
# Mail de bienvenue = un bouton vers /bienvenue/<lien> où le membre définit son mot de passe (aucun identifiant
# dans le mail, 2026-09-19). Le lien expire, la page propose d'en recevoir un nouveau. Page publique
# /inscription : le compte est créé suspendu, l'admin l'active depuis /accounts (mail au membre à ce moment-là).
link_ttl_mins = 60
public_signup = true
max_signups_per_day = 10      # toutes adresses confondues ; au-delà, la page demande de réessayer demain
renew_per_hour = 3            # renvois de lien par adresse et par heure

[discord]
# Webhooks dans .env : DISCORD_WEBHOOK_MEMBERS (#jellyfin : nouveautés des Arrs, demandes Jellyseerr, annonces du
# tchat) et DISCORD_WEBHOOK_ADMIN (salon privé : alertes homelabd, santé des Arrs). `homelabctl discord apply`
# configure les 4 Arrs et Jellyseerr ; `test` poste un message d'essai ; `remove` retire tout.
announcements = true          # annonces du tchat → salon des membres
admin_alerts = true           # alertes admin (boucles HLS, indexeur, inscriptions, relances) → salon admin

[tasks]
# Tâches non planifiées par le daemon (restent lançables via `homelabctl run`).
disabled = ["tba_bypass"]  # tba_bypass inutile depuis episodeTitleRequired = never ; gardée comme filet

[tasks.stack_health]
# Première passe juste après le boot, puis toutes les 5 min : relance ce qui est arrêté,
# redémarre ce qui est unhealthy ou dont la sonde applicative échoue. Pour arrêter un
# service volontairement, l'ajouter à `ignore` (sinon il sera relancé).
interval_secs = 300
restart_cooldown_secs = 600
unhealthy_grace_secs = 120
ignore = []

# Sonde Guacamole : de faux identifiants doivent produire 403 INVALID_CREDENTIALS ;
# 500 = extension MySQL morte (guacdb n'était pas prêt au démarrage). ≥ 5 min entre
# deux sondes pour ne pas déclencher l'extension ban (5 échecs / 300 s).
[[tasks.stack_health.probes]]
service = "guacamole"
method = "POST"
url = "http://localhost:8081/guacamole/api/tokens"
body = "username=homelabd-probe&password=probe"
content_type = "application/x-www-form-urlencoded"
expect_status = 403
expect_body_contains = "INVALID_CREDENTIALS"
requires_healthy = ["guacdb"]
action = "restart"
post_exec_in = ""
post_exec = []

[[tasks.stack_health.probes]]
# qBittorrent vu de L'HÔTE (2026-10-02, audit de résilience) : il partage le réseau de gluetun ; quand gluetun est
# recréé, qBittorrent reste « healthy » (sa sonde interne passe) mais injoignable de partout (19/09 : 11 h). Sonde
# externe ; en échec alors que gluetun est sain → recréé, puis le port transféré est reposé par le hook de gluetun.
service = "qbittorrent"
url = "http://localhost:8080/api/v2/app/version"
expect_status = 200
requires_healthy = ["gluetun"]
method = "GET"
body = ""
content_type = "application/x-www-form-urlencoded"
expect_body_contains = ""
action = "recreate"
post_exec_in = "gluetun"
post_exec = ["sh", "-c", "/gluetun/scripts/qbit-update-port.sh \"$(cat /tmp/gluetun/forwarded_port)\""]

[tasks.id_match_import]
# Débloque les imports « matched to movie/series by ID » (releases C411 en titre français) :
# import manuel rattaché à la fiche connue par l'historique, fichiers sans rejet seulement.
interval_secs = 300

[tasks.torrent_import]
# Torrents ajoutés à la main dans qBittorrent (VPS + seedbox), terminés et inconnus des Arrs :
# fiche ajoutée NON surveillée si besoin, puis import manuel en hardlink (importMode copy).
# Rien si la fiche a déjà des fichiers sur l'autre machine (doublon Jellyfin).
interval_secs = 120
max_per_run = 10            # torrents examinés (parse/recherche/import) par passage
max_attempts = 3            # erreurs avant abandon (état : homelabctl status / state/homelabd.json)
series_ready_secs = 90      # attente des épisodes d'une série tout juste ajoutée

[tasks.deletion_cleanup]
# Titre supprimé dans Jellyfin (fichier absent du disque ET de Jellyfin, deux passages de suite) :
# fiche Radarr/Sonarr retirée (ou saison/épisodes non surveillés), média Jellyseerr libéré, torrent
# retiré avec ses fichiers (C411 : seulement à ratio 1 ou 7 j de seed).
interval_secs = 300
max_titles_per_run = 5
abort_if_missing_titles_over = 10   # au-delà : disque ou montage en cause, on ne touche à rien
confirm_after_secs = 240
min_file_age_mins = 60              # imports récents ignorés (cache rclone, scan Jellyfin)
c411_min_ratio = 1.0
c411_min_seed_days = 7
vps_paths = [
  ["/movies", "/opt/homelab/library/media/movies", "/media/movies"],
  ["/tv", "/opt/homelab/library/media/tvshows", "/media/tvshows"],
  ["/anime-films", "/opt/homelab/library/media/anime-films", "/media/anime-films"],
  ["/anime", "/opt/homelab/library/media/anime", "/media/anime"],
]

[tasks.seedbox_health]
# Santé de la seedbox vue du VPS (2026-10-02) : le 01/10, l'hôte de la seedbox a redémarré et Sonarr, Radarr, Bazarr…
# sont restés arrêtés 16 h sans alerte. La seedbox se relance seule (crontab : scripts/seedbox/homelab-apps-watch.sh) ;
# cette tâche prévient (mail + Discord admin) si un service reste injoignable, puis quand il revient.
interval_secs = 300
alert_after_mins = 10
mount_check = "/mnt/seedbox/media"

[tasks.hls_loop_watch]
# Boucles HLS (audit lecture du 2026-09-18) : un client qui redemande sans fin le même segment d'un flux
# transcodé — ce que le membre voit comme « ça charge ». Le 13/09, une TV webOS a redemandé 2 segments
# ~950 fois en 6 min. Lu dans le journal d'accès NPM (UTC) ; au-delà du seuil : avertissement + mail admin,
# une fois par (client, média). Relève aussi les 5xx sur les segments.
# Rafales de ffmpeg (2026-10-04) : un lecteur qui relance son flux en boucle sans redemander le même segment
# (télé Samsung : 116 remux en 1 h le 30/09 ; Chromecast : 42 en 22 min le 04/10). Compté par titre sur
# l'heure écoulée d'après les journaux FFmpeg.* de Jellyfin, sans les titres du canari ; mail une fois par
# titre et par jour. Lecture normale : 17 au plus.
interval_secs = 300
npm_access_log = "/opt/homelab/npm/data/logs/proxy-host-1_access.log"
tail_bytes = 4194304        # 4 Mio relus en fin de journal
window_secs = 300
threshold = 20              # demandes d'un même segment dans la fenêtre
max_jobs_per_item_hour = 30 # lancements de ffmpeg pour un même titre dans l'heure

[tasks.trending]
# Rangée « Tendances cette semaine » de l'accueil Jellyfin : titres les plus regardés (spectateurs
# distincts, puis heures), épisodes regroupés par série, depuis Playback Reporting.
interval_secs = 21600
days = 7
fallback_days = 30      # semaine trop calme : complète avec le mois
size = 10
min_minutes = 10        # visionnage minimal par spectateur et par titre
collection_name = "Tendances cette semaine"

[tasks.subtitle_sync]
# Pistes françaises incrustées (ASS/SRT) des fichiers de la seedbox → fichiers externes à codec identique, extraits SUR
# la seedbox (scripts/seedbox/gc-extract-sub.sh par ssh, un ffmpeg à la fois, rien sur le lien), SRT sans panneaux
# dérivé de l'ASS pour AirPlay/TV, puis FullRefresh de la fiche Jellyfin (seul moyen de voir un fichier annexe).
# Les plus récents d'abord ; jamais pendant une lecture de l'item.
interval_secs = 300
max_per_run = 40
max_seconds = 420          # le planificateur coupe une tâche à 600 s : on s'arrête avant et on reprend au passage suivant
extract_script = "~/bin/gc-extract-sub.sh"
retry_hours = 6            # un item déjà traité n'est revu qu'après ce délai (le 22/09, Jellyfin bloqué : 157 passages à vide)
failed_retry_days = 7      # item sans piste extractible (code 3 : aucune piste, extraction vide) : un essai par semaine
max_default_ass_mb = 8     # au-delà, l'ASS complet n'est pas marqué par défaut, le SRT l'est (Blue Box : ASS de 43,8 Mo)

[tasks.playback_canary]
# Canari de lecture : toutes les 15 min, un transcodage réel de deux segments (un fichier VPS, un seedbox en
# alternance) ; alerte admin (mail + Discord) au premier échec ou si le premier segment met plus de 20 s.
interval_secs = 900
max_first_segment_secs = 20
skip_if_transcodes_at_least = 2

[tasks.subscription_cycle]
# Rappels, passage en grâce, suspension à la fin de la grâce, réactivation (voir [subscriptions]).
interval_secs = 3600

[tasks.subscription_reconcile]
# Relit chaque abonnement PayPal connu (statut, prochaine facturation) et corrige les écarts (webhook manqué).
interval_secs = 86400

[tasks.playback_limit]
# Au-delà de accounts.max_playbacks_per_user lectures d'un même compte : la plus récente est arrêtée,
# avec un message à l'écran, après grace_secs (le temps de passer d'un appareil à l'autre).
interval_secs = 20
grace_secs = 30
max_actions_per_run = 5

[tasks.series_search]
# Saisons suivies et manquantes cherchées PAR IDENTIFIANT TMDB chez C411, via Prowlarr : les releases
# de la série quel que soit leur nom (japonais, anglais, français), une requête par saison. Jellyseerr
# ne demande plus de recherche à Sonarr (preventSearch) : ses rafales par épisode déclenchaient le 429
# de C411 et bloquaient l'indexeur jusqu'à 24 h. Release confiée à Sonarr (release/push) ; refus
# d'identification ou indexeur bloqué → qBittorrent avec l'étiquette homelab:series=<id>.
interval_secs = 600         # 10 min : une demande part dans les minutes qui suivent
max_queries_per_run = 6     # requêtes au plus par passage (36/h au pire, sous le plafond par clé)
query_gap_secs = 5          # écart minimal entre deux requêtes
max_grabs_per_season = 60   # saison sans pack : TOUS les épisodes manquants dans le même passage (une
                            # saison d'animé en fait 50 ; à 20 il fallait 3 passages, soit ~50 min pour
                            # Bleach S17 le 2026-09-18, alors que la recherche ne coûte qu'UNE requête)
max_new_per_run = 3         # requêtes en plus pour les demandes de moins d'une heure (elles passent devant)
new_request_hours = 1
episode_retry_mins = 5      # reprise 5 min après (le temps de l'import) : il reste des épisodes à prendre,
                            # rien ne sert d'attendre — aucune requête d'indexeur n'est gaspillée
retry_after_hours = 24      # saison sans candidat : nouvelle recherche le lendemain
grabbed_retry_hours = 168   # saison prise mais encore manquante : après 7 jours
error_retry_hours = 1       # erreur (indexeur indisponible, délai dépassé) : nouvelle tentative dans l'heure
indexer = "C411"            # nom de l'indexeur dans Prowlarr
text_queries = 2            # rien par identifiant : noms de la série essayés en texte libre
prowlarr_url_for_arrs = "http://prowlarr:9696"  # Prowlarr vu des conteneurs Sonarr/Radarr (lien de téléchargement)
# Cours d'animés publiés sous leur propre titre (« Thousand-Year Blood War S03 » = S17E27-40 de Bleach) :
# la recherche par identifiant ne les renvoie pas et Sonarr les rattache à la MAUVAISE saison. On lit la
# liste des fichiers dans le .torrent (aucune annonce au tracker) et on n'agit que si tout concorde :
# trou contigu, autant de fichiers vidéo que d'épisodes manquants, numérotés en suite, aucun épisode
# déjà pourvu. Animés seulement. La correspondance voyage dans l'étiquette qBittorrent (`offset=`).
cour_packs = true
cour_max_files = 30         # au-delà, ce n'est plus un cours
# Épisodes SANS date de diffusion dans une saison déjà commencée : TheTVDB a souvent des semaines ou des mois de
# retard sur les séries françaises, et Sonarr ne met pas ces épisodes dans « manquants ». Le 2026-09-23, *Le
# Voyageur* S04E02-E03 étaient sur C411 mais jamais cherchés (seul E01 était daté). On lit les épisodes des seules
# séries dont une saison suivie a eu une diffusion dans la fenêtre et n'est pas complète.
undated_episodes = true
undated_window_days = 730
# INTÉGRALES (2026-10-03) : un pack sans numéro de saison (« Space.Dandy.INTEGRALE.MULTI.VFF.1080p… ») n'apparaît
# pas dans la recherche par saison et Sonarr ne lit rien dans son nom. Space Dandy est resté « introuvable » alors
# que C411 avait cette intégrale. Quand rien d'autre n'est acceptable pour une saison : intégrales vues dans les
# résultats (même identifiant TMDB), sinon UNE requête par identifiant sans saison ; liste des fichiers lue dans
# le .torrent (aucune annonce), chaque fichier rattaché par le parse de Sonarr (scene mapping compris), et seuls
# les fichiers des épisodes manquants sont téléchargés (les autres désélectionnés avant le démarrage).
integrale_packs = true
integrale_max_files = 300     # au-delà, pas examinée (un parse Sonarr par fichier)
integrale_min_age_days = 14   # requête « toutes saisons » seulement si le dernier épisode manquant a 14 j ou plus

[tasks.movie_search]
# Recherche des films suivis encore manquants, par identifiant TMDB chez C411, dès le passage qui suit
# la demande : depuis le 2026-09-17, Radarr n'a plus aucune recherche (C411 en RSS seulement), le RSS ne
# ramène que les nouveautés — avec 24 h, un film demandé attendait un jour (Matrix, le 2026-09-19).
interval_secs = 300         # 5 min : un film demandé part dans les minutes qui suivent (demande du 2026-09-19)
max_per_run = 3
missing_hours = 0
retry_after_hours = 72
error_retry_hours = 1
query_gap_secs = 5
indexer = "C411"
# Film FRANÇAIS sans date numérique connue : Radarr le croit disponible 90 jours après la salle, mais en France la
# VOD arrive 4 mois après (chronologie des médias) et C411 n'a rien avant. On ne le cherche pas avant N jours après
# la salle ; le membre voit « VOD vers le … » dans l'onglet Demandes (Le Vertige, 2026-09-25). Le RSS reste actif.
min_days_after_cinema = 110

[tasks.russian_search]
# Voie russe : Sonarr/Radarr cherchent par le titre anglais, RuTracker range par le titre russe (« The Interns »
# → rien, « Интерны » → 18 releases). Cherche par le TITRE ORIGINAL TMDB dans le Jackett de la seedbox, prend la
# release qui couvre le plus d'épisodes manquants (numérotation absolue des séries russes), ne télécharge que ces
# fichiers, puis les importe (lien physique).
interval_secs = 600
jackett_url = "https://kakaouette.tofino.usbx.me/jackett"
indexer = "rutracker"
retry_hours = 24
max_per_run = 2
min_seeders = 2
max_gb_per_episode = 3.0
max_gb_per_movie = 20.0

[tasks.anime_library]
# Animation japonaise (classement TMDB, tags manuels `anime` / `pas-anime` prioritaires) rangée dans les
# bibliothèques « Anime » et « Films d'animation » : tag `anime` + déplacement par l'éditeur de l'Arr.
# Jamais ressortie automatiquement. `only_tmdb` = essai limité à ces identifiants (vide = tous).
interval_secs = 300             # 1800 jusqu'au 26/09 : un animé attendait jusqu'à 30 min avant d'être rangé
max_moves_per_run = 5
max_lookups_per_run = 150
recheck_days = 30
vps_series_root = "/anime"
vps_movies_root = "/anime-films"
seedbox_series_root = "/home/kakaouette/media/Anime"
seedbox_movies_root = "/home/kakaouette/media/Anime Movies"
only_tmdb = []
# Un titre déplacé d'une bibliothèque seedbox à une autre n'apparaît qu'après une analyse complète (Your Name,
# 45 min d'attente le 26/09) : lancée après un déplacement, au plus une fois toutes les scan_min_gap_mins.
scan_after_move = true
scan_min_gap_mins = 20
# Voie russe = CHOIX du membre (dossier « Russian » choisi dans Jellyseerr, ou tag `russe`), pas la langue TMDB : rangé dans ces dossiers de la
# seedbox (Jellyfin « Séries russes » / « Films russes », compte d'un membre seulement) ; une fiche sans fichier est
# recherchée par l'Arr, qui n'interroge que RuTracker (indexer du Jackett seedbox, tag `russe`).
russian = true
seedbox_ru_series_root = "/home/kakaouette/media/Russian"
seedbox_ru_movies_root = "/home/kakaouette/media/Russian Movies"
seedbox_default_series_root = "/home/kakaouette/media/TV Shows"   # retour à la voie classique
seedbox_default_movies_root = "/home/kakaouette/media/Movies"
ru_search_retry_hours = 24

[tasks.identity_check]
# Jellyfin identifie un dossier d'après son nom : trois séries sont parties sur un spin-off (Attaque des
# Titans → Junior High, Slime → Slime Diaries, Walking Dead → Dead City). On compare chaque fiche Jellyfin à
# l'identifiant de Sonarr/Radarr, qui fait foi, et on corrige (RemoteSearch + Apply + métadonnées).
interval_secs = 1800
max_fixes_per_run = 3
# Les groupes de release écrivent leur nom dans la métadonnée « title » du fichier ; les bibliothèques ont été
# passées à EnableEmbeddedTitles = false le 2026-09-22, mais les fiches déjà créées gardent ce nom tant qu'elles
# ne sont pas ré-identifiées (un simple refresh ne suffit pas, mesuré). Une fiche est réessayée au plus tous les 30 j.
fix_release_names = true

[tasks.indexer_unblock]
# Indexeurs mis en pause par Sonarr/Radarr (429, délais) : pause levée dans leur base (application
# arrêtée ~20 s, base sauvegardée) si le dernier échec date d'au moins quiet_mins. Au-delà de
# max_unblocks_per_day déblocages en 24 h : mail à l'admin seulement.
interval_secs = 300
quiet_mins = 15             # fenêtre de limite de C411 : plus tôt, il se rebloquerait aussitôt
app_cooldown_mins = 60      # au plus un arrêt par application par heure
max_unblocks_per_day = 10
ssh_host = "seedbox"
seedbox_apps_dir = "/home/kakaouette/.apps"

[tasks.seedbox_refresh]
# Nouveaux imports des Arrs seedbox → rafraîchit le cache rclone et signale les fichiers à Jellyfin.
interval_secs = 300

[tasks.tracker_ratio]
interval_secs = 1800
# c411 : seed illimité ; ygg/u2p + publics : 2.0 / 14 j ; défaut : 1.0 / 7 j
unlimited = ["c411.org", "c411.tw"]   # C411 annonce aussi via tk.c411.tw (24 torrents mal classés jusqu au 2026-09-14)
secondary = ["yggleak", "u2p", "ygg.gratis", "t-ru.org"]   # t-ru.org = RuTracker (voie russe), ratio compté
public_ratio = 2.0
public_time_min = 20160
default_ratio = 1.0
default_time_min = 10080

[tasks.stuck_handler]
interval_secs = 300
stall_secs = 28800          # 8 h bloqué avant remplacement
max_actions_per_run = 5
pattern = "stalled|metadata|no connections"

[tasks.disk_pressure]
interval_secs = 900
hard_pct = 95               # supprime les torrents arrêtés les plus anciens
crit_pct = 98               # log seulement, action manuelle
max_actions_per_run = 5

[tasks.tba_bypass]
interval_secs = 300

[tasks.monitor_sync]
interval_secs = 600

[tasks.user_poller]
interval_secs = 60
max_age_secs = 600
admin_user_id = 1

[auto_import]
enabled = true
settle_secs = 5
archive_stable_checks = 3
archive_max_wait_secs = 1800
radarr_root = "/movies"
sonarr_root = "/tv"

[cleanup]
interval_secs = 86400
# Vide : les transcodages de Jellyfin sont dans un tmpfs du conteneur (/cache/transcodes, masque ce dossier de
# l'hôte), purgé chaque minute par scripts/jellyfin-transcodes-purge.sh. L'ancien chemin visait un dossier vide.
transcodes_dir = ""
transcodes_max_age_days = 1
empty_download_dirs_max_age_days = 2
recycle_dirs = ["/opt/homelab/library/media/movies/.recycle", "/opt/homelab/library/media/tvshows/.recycle"]
recycle_max_age_days = 14
jellyfin_log_dir = "/opt/homelab/jellyfin/config/log"
jellyfin_log_max_age_days = 7

[backup]
# `cache` = cache rclone de la seedbox (fichiers creux de plusieurs centaines de Go) : sans lui la sauvegarde du
# 2026-09-20 faisait 149 Go au lieu de 3. Vignettes de défilement (trickplay, 3,3 Go) et photos d'acteurs (2,3 Go) :
# régénérées par Jellyfin, exclues depuis le 2026-09-23 (archive de 7,9 Go au lieu de ~3).
excludes = ["library", "backups", "cache", "influxdb", "jellyfin/cache", "jellyfin/config/log", "target", "logs", "jellyfin/config/data/trickplay", "jellyfin/config/metadata/People"]
# Bases SQLite des services en marche : un tar les prenait en pleine écriture (base, -wal et -shm lus à des
# instants différents, donc restauration incertaine). Chacune est d'abord copiée par l'API de sauvegarde SQLite
# (lecture seule, ~1 s pour les 19 bases mesurées le 2026-10-05, 120 Mo dont 85 pour jellyfin.db) dans
# `state/backup-snapshots/<chemin>`, vérifiée (`quick_check`), et la base vivante (+ -wal, -shm, -journal) sort de
# l'archive. `*` permis dans le nom de fichier seulement ; un fichier qui n'est pas une base SQLite est ignoré.
# Une base qui ne se copie pas reste dans l'archive telle quelle (avertissement), la sauvegarde continue.
sqlite = ["state/*.db", "jellyfin/config/data/*.db", "jellyfin/config/data/introskipper/*.db", "jellyfin/config/data/NotifySync/*.db", "jellyseerr/config/db/db.sqlite3", "sonarr/config/*.db", "radarr/config/*.db", "prowlarr/config/*.db", "homarr/db/db.sqlite", "grafana/grafana.db", "npm/data/database.sqlite", "pyload/config/data/pyload.db"]
keep_last = 4
mysql_container = "guacdb"

[vpn]
qbit_conf = "/opt/homelab/qbittorrent/config/qBittorrent/qBittorrent.conf"
npm_server_name = "qbittorrent."

[accounts]
# Premium = compte Jellyfin actif ; non-premium = suspendu (connexion refusée, rien de supprimé).
# Page d'admin : onboarder.<domaine>/accounts. Plafonds : 6 vCPU sans GPU (1-2 transcodages),
# lien seedbox ~190 Mbit/s ; pic mesuré 4 lectures pour 13 comptes (2026-09-14).
max_premium = 25
max_devices_per_user = 0      # MaxActiveSessions de Jellyfin : 0 = illimité (bloquait les iPhone, sessions fantômes)
max_playbacks_per_user = 2    # lectures simultanées : la tâche playback_limit arrête la 3e (comptes protégés exemptés)
new_accounts_premium = false   # les comptes créés par l'onboarding sont à activer à la main
protected = ["Haradas", "LeGrosCailloux"]   # ni interrupteur ni suppression sur la page
# Demandes Jellyseerr validées d'office (films et séries, jamais 4K), à la création et à l'activation.
# Garde-fou : quota par défaut de Jellyseerr, 10 films + 10 saisons / 7 j (réglé dans Jellyseerr).
jellyseerr_auto_approve = true
# Chaque membre voit toutes les demandes (Jellyseerr et onglet Demandes de Jellyfin), sans pouvoir les
# valider ni les refuser : vue d'ensemble demandée par l'admin le 2026-09-17.
jellyseerr_view_requests = true

# Saut du lecteur Jellyfin (bouton d'avance rapide ET flèches gauche/droite : les deux passent par
# `skipForwardLength`). Jellyfin met 30 s en avant par défaut, ce qui fait rater une réplique à chaque
# clic ; 10 s des deux côtés. Posé à la création d'un compte ; les 16 comptes existants ont été
# convertis le 2026-09-18 (sauvegarde backups/jellyfin-skip-20260918-155125/).
skip_forward_ms = 10000
skip_back_ms = 10000
# Langue posée sur chaque compte (onboarding + rattrapage du 2026-09-21) : piste française d'un MULTi choisie
# d'office, sous-titres français seulement quand l'audio n'est pas en français (Smart). Le membre peut passer en
# « VO sous-titrée » depuis « Mon compte ».
audio_language = "fre"
subtitle_language = "fre"
subtitle_mode = "Smart"
# Mode « VO » de Mon compte (2026-09-25) : Jellyfin n'accepte qu'UNE langue audio préférée par compte. Le japonais
# couvre les animés sur tous les appareils (applis TV comprises) ; pour les films et séries, le script Mon compte
# bascule sur la piste d'origine (anglais d'abord) dans les clients web. Avant : langue vide + piste « par défaut »
# du fichier, qui est la française dans la plupart des MULTi (JoJo parti en VF).
vo_audio_language = "jpn"

[indexers]
# C411 est le SEUL indexer, dans les 4 Arrs comme dans Prowlarr (les indexers publics et Jackett ont été
# retirés le 2026-09-17 : ils ne servaient qu'en interactif, faisaient durer une recherche plusieurs minutes
# et remplissaient le journal d'erreurs). Un seul compteur horaire pour tout ce qui l'interroge.
c411_max_per_hour = 40        # PAR CLÉ (deux clés = 80/h) ; Prowlarr coupe à 45/h par indexer
cooldown_after_429_mins = 15  # clé qui prend un 429 : mise de côté, tout continue sur l'autre
manual_reserve = 10           # requêtes gardées pour la page /recherche
allow_no_french = true        # release sans français (VO) prise en dernier recours, si rien de français
# Le CODEC ne départage rien (2026-09-18) : h264 et HEVC transcodent à la même vitesse sur ce serveur
# (1,85× les deux), les clients lisent le HEVC en direct, et 53 % de la médiathèque est déjà en HEVC.
# Écarter le x265 revenait à refuser la seule version française des animés. Formats HEVC/H.264/AV1 à 0
# dans les 4 profils FR-friendly.
# Plafond à l'acquisition (audit lecture du 2026-09-18) : sans GPU ni ABR, un fichier > ~15 Mbit/s saccade
# chez un membre à connexion moyenne, et 128 fichiers > 15 Mbit/s (remux 4K jusqu'à 103 Mbit/s) étaient déjà
# entrés. 3 Go par épisode de 24 min ≈ 17 Mbit/s ; 15 Go par film de 2 h ≈ 17 Mbit/s. Même plafond côté Arrs :
# 110 Mo/min sur les qualités 1080p (qualitydefinition). L'existant n'est pas touché.
max_gb_per_episode = 3.0      # au-delà, écartée du choix automatique (reste visible sur la page)
max_gb_per_movie = 15.0
# Secours PUBLIC (sans compte), seulement quand C411 est en panne (2026-09-30, « Incident en cours ») : recherche en
# texte libre, release rattachée par le `parse` de l'Arr, mêmes règles de langue / taille / codec. Vide = aucun.
fallback = "World-torrent"
fallback_anime = "Nyaa.si"     # animés : Nyaa d'abord (releases françaises seulement), puis World-torrent
fallback_retry_hours = 12      # secours sans résultat : refait toutes les 12 h ; C411 revenu = tout de suite

[downloads]
# Tout ce qui est neuf passe par la SEEDBOX (2026-09-18). Le VPS garde ses fiches, ses fichiers et ses
# imports manuels, mais aucune tâche ne lui fait plus prendre de release, et son indexer C411 est en
# RSS coupé (`enableRss = false` sur Sonarr et Radarr du VPS, sauvegarde backups/vps-rss-off-20260918-093803).
# Remettre "vps" ici ne suffit donc pas : il faudrait aussi réactiver le RSS côté Arr.
auto_sides = ["seedbox"]

[manual_search]
# Page /recherche (onboarder, liste admin-outils + jeton) : recherche manuelle d'une saison ou d'un film par
# identifiant TMDB chez C411, titres de la fiche en secours. À utiliser au lieu de la recherche de
# Sonarr/Radarr pour un animé (une requête par épisode et par titre connu).
c411_indexer = "C411"
text_queries = 2
results_ttl_mins = 30

[subscriptions]
# Abonnés et cycle premium (v1.18, 2026-09-20). Fiche par compte dans state/subscriptions.db (sauvegardée).
# Statuts : essai, actif, échéance dépassée (grâce), suspendu, offert, exempt, à qualifier (jamais touché par
# le cycle). PayPal relié par webhooks (PAYPAL_* dans .env) ; l'admin garde la main sur /accounts.
enabled = true
db_file = "/opt/homelab/state/subscriptions.db"
period_days = 31          # couverture d'un paiement quand PayPal n'annonce pas la prochaine facturation
grace_days = 3            # après l'échéance, avant suspension (rien n'est supprimé)
remind_days = [7, 1]      # rappels au membre, N jours avant l'échéance
trial_days = 7            # essai gratuit à l'inscription publique (0 = activation manuelle comme avant)
referral_days = 15        # jours offerts au parrain et au filleul au premier paiement du filleul
referral_cap_days_per_year = 90
exempt = []               # jamais suspendus par le cycle (accounts.protected l'est déjà)
cycle_dry_run = false     # réel depuis le 2026-09-27 (semaine d observation sans action)
price_text = "3,50 € / mois"

[chat]
# Tchat des membres dans Jellyfin (bulle en haut à droite) : salons Annonces (modérateurs), Entraide,
# Discussion, et un fil privé membre ↔ modérateurs. API homelabd /chat/*, publiée par NPM sous
# /gc-chat/ sur l'adresse de Jellyfin ; script chargé par le plugin JavaScript Injector.
enabled = true
moderators = ["Haradas", "LeGrosCailloux"]   # écrivent les annonces, lisent les fils privés
beta_users = []      # [] = tchat ouvert à tous ; sinon visible de ces comptes seulement (phase de test)
db_file = "/opt/homelab/state/chat.db"
max_chars = 2000
min_gap_secs = 3
burst_max = 30              # messages au plus par fenêtre et par membre
burst_window_secs = 600
delete_own_within_mins = 15
moderator_mail_interval_mins = 15   # récapitulatif entraide + privé : au plus un mail par intervalle

[seedbox]
# Seedbox (tofino.usbx.me) : Radarr/Sonarr y rangent dans ~/media, monté en lecture seule sur
# /mnt/seedbox/media (homelab-seedbox-mount.service) et vu par Jellyfin sous /seedbox/media.
# Couper la seedbox : enabled = false (+ procédure docs/DEPLOY.md).
enabled = true
radarr_url = "https://kakaouette.tofino.usbx.me/radarr"
sonarr_url = "https://kakaouette.tofino.usbx.me/sonarr"
sonarr_downloads = "/home/kakaouette/downloads/qbittorrent/sonarr"
media_root = "/home/kakaouette/media"
mount_point = "/mnt/seedbox/media"
jellyfin_root = "/seedbox/media"
rclone_rc = "http://127.0.0.1:5572"
jellyseerr_vps_sonarr_id = 0
jellyseerr_sonarr_id = 1
# qBittorrent de la seedbox (proxy HTTPS, mot de passe SEEDBOX_QBIT_PASSWORD) et où
# torrent_import range les fiches qu'il ajoute dans les Arrs seedbox.
qbit_url = "https://kakaouette.tofino.usbx.me/qbittorrent"
qbit_user = "kakaouette"
radarr_root = "/home/kakaouette/media/Movies"
sonarr_root = "/home/kakaouette/media/TV Shows"
quality_profile_id = 7      # « FR-friendly H.264 »
bazarr_url = "https://kakaouette.tofino.usbx.me/bazarr"   # clé : SEEDBOX_BAZARR_API_KEY
