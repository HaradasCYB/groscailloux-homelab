# Remote de la seedbox, monté en lecture seule sur /mnt/seedbox par homelab-seedbox-mount.service.
# Clé dédiée restreinte côté seedbox à `sftp-server -R` (lecture seule, pas de shell) :
# pas de shell_type ni de commandes de hash, et aucun secret ici.
[seedbox]
type = sftp
host = tofino.usbx.me
user = kakaouette
port = 22
key_file = /home/deploy/.ssh/seedbox_sftp_ro
known_hosts_file = /home/deploy/.ssh/known_hosts
shell_type = none
md5sum_command = none
sha1sum_command = none
set_modtime = false
concurrency = 16
# blocs SFTP de 255 Ko : 5 → 16 Mo/s par flux sur 96 ms de latence (mesuré le 2026-09-12)
chunk_size = 255k
