name: shellcheck
on:
  push:
    branches: [main, v2]
    paths: ["**.sh", .github/workflows/shellcheck.yml]
  pull_request:
    paths: ["**.sh"]
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck -S warning setup.sh hooks/*.sh
