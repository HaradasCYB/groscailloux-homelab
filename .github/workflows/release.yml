name: release
# Release publique à chaque tag de version (v1.x.y depuis le 08/10/2026, accord du propriétaire) : binaires musl
# homelabd + homelabctl et SHA256SUMS, téléchargés par setup.sh (vérifiés avant installation).
on:
  push:
    tags: ["v1.*", "v2.*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe --tags (build.rs) : version exacte dans homelabd --version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - name: package
        run: |
          mkdir -p dist
          tar -czf dist/homelab-x86_64-unknown-linux-musl.tar.gz \
            -C target/x86_64-unknown-linux-musl/release homelabd homelabctl
          (cd dist && sha256sum homelab-x86_64-unknown-linux-musl.tar.gz > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/homelab-x86_64-unknown-linux-musl.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
