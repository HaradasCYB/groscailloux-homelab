<!doctype html><html><head><meta charset="utf-8">
<!-- Image d'aperçu des liens (Open Graph, 1200x630) : rendue en og-card.png, servie par NPM (docs/runbooks/npm.md). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,500;112,800;112,900&display=swap">
<style>
  html,body{margin:0;background:#0b0d12}
  #og{width:1200px;height:630px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:46px;
      background:radial-gradient(ellipse 70% 60% at 50% 42%,#16305c 0%,#0f1a30 45%,#0b0d12 100%);font-family:"Archivo",sans-serif;font-stretch:112%}
  .banner{display:flex;align-items:center;gap:22px}
  .banner svg{width:128px;height:128px;flex:none}
  .word{font-weight:900;font-size:100px;letter-spacing:-3px;color:#f4f6fa;line-height:1}
  .tv{font-weight:800;font-size:64px;color:#fff;background:linear-gradient(135deg,#5aa6ff,#1f6fe0);border-radius:15px;padding:4px 15px 7px;margin-left:16px;line-height:1;letter-spacing:-1px}
  .tag{font-weight:500;font-size:38px;color:#b9c3d6;letter-spacing:.2px}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6cb2ff"/><stop offset=".55" stop-color="#2f8fff"/><stop offset="1" stop-color="#1552b8"/></linearGradient>
  <symbol id="galet" viewBox="0 0 64 64">
    <path d="M32 5c15 0 28 7.5 28 23.5C60 46 47.5 59 31 59 14.5 59 4 47.5 4 32.5 4 16 16.5 5 32 5z" fill="url(#g)"/>
    <path d="M14 16c5-5 12-7 18-7" stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M26 21.5v21l17-10.5z" fill="#fff"/>
  </symbol></defs></svg>
<div id="og">
  <div class="banner"><svg><use href="#galet"/></svg><span class="word">Groscailloux</span><span class="tv">TV</span></div>
  <div class="tag">Films, séries et animés, en français</div>
</div>
</body></html>
