name: rust
on:
  push:
    branches: [main, v2]
    paths: [Cargo.toml, Cargo.lock, rust-toolchain.toml, "crates/**", .github/workflows/rust.yml]
  pull_request:
    paths: [Cargo.toml, Cargo.lock, rust-toolchain.toml, "crates/**"]
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: homelab-x86_64-unknown-linux-musl
          path: |
            target/x86_64-unknown-linux-musl/release/homelabd
            target/x86_64-unknown-linux-musl/release/homelabctl
